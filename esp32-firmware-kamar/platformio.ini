; PIC: Binar
; Project PlatformIO untuk ESP32 + MQ-2 + DHT22.
; Bisa langsung disimulasikan di Wokwi dari VS Code (ekstensi "Wokwi for VS Code"),
; tanpa perlu ESP32 fisik dulu. Begitu hardware asli datang, upload langsung
; ke board lewat PlatformIO (tombol Upload), kode tidak perlu diubah.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4
    adafruit/Adafruit Unified Sensor @ ^1.1
